<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Myriam Khorchani, BTS SIO SISR, systèmes et réseaux" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#1A1030"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF4D9D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF4D9D" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FF4D9D" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FF4D9D" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="typing">
      <rect x="60" y="180" height="34" width="0">
        <animate attributeName="width" values="0;300;300;0" keyTimes="0;0.45;0.9;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Fond -->
  <rect width="1000" height="280" rx="14" fill="url(#bg)"/>
  <rect width="1000" height="280" rx="14" fill="url(#grid)"/>

  <!-- Ligne de balayage -->
  <rect x="0" y="-60" width="1000" height="60" fill="url(#scan)">
    <animate attributeName="y" values="-60;280" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Flux de données en arrière-plan -->
  <g font-family="'Courier New', monospace" font-size="14" fill="#FF4D9D" opacity="0.18">
    <text x="520" y="0">01101001
      <animateTransform attributeName="transform" type="translate" values="0 0;0 300" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="580" y="-90">10010110
      <animateTransform attributeName="transform" type="translate" values="0 0;0 380" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="960" y="-40">0110
      <animateTransform attributeName="transform" type="translate" values="0 0;0 340" dur="10s" repeatCount="indefinite"/>
    </text>
    <text x="30" y="-150">1011
      <animateTransform attributeName="transform" type="translate" values="0 0;0 430" dur="14s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Réseau : liens -->
  <g stroke="#FF4D9D" stroke-width="1.5" stroke-opacity="0.55" stroke-dasharray="6 6" fill="none">
    <line x1="700" y1="70" x2="800" y2="140"><animate attributeName="stroke-dashoffset" values="0;-24" dur="1.6s" repeatCount="indefinite"/></line>
    <line x1="800" y1="140" x2="900" y2="60"><animate attributeName="stroke-dashoffset" values="0;-24" dur="1.6s" repeatCount="indefinite"/></line>
    <line x1="800" y1="140" x2="760" y2="220"><animate attributeName="stroke-dashoffset" values="0;-24" dur="1.6s" repeatCount="indefinite"/></line>
    <line x1="800" y1="140" x2="900" y2="210"><animate attributeName="stroke-dashoffset" values="0;-24" dur="1.6s" repeatCount="indefinite"/></line>
    <line x1="700" y1="70" x2="760" y2="220" stroke="#58A6FF" stroke-opacity="0.35"><animate attributeName="stroke-dashoffset" values="0;-24" dur="2.4s" repeatCount="indefinite"/></line>
  </g>

  <!-- Réseau : nœuds -->
  <g>
    <circle cx="800" cy="140" r="11" fill="#FF4D9D">
      <animate attributeName="r" values="11;15;11" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="70" r="7" fill="#58A6FF">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="60" r="7" fill="#F9A8D4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="220" r="7" fill="#F9A8D4">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="210" r="7" fill="#58A6FF">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Titre -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="60" y="105" font-size="50" font-weight="700" fill="#FFFFFF">Myriam <tspan fill="#FF4D9D">Khorchani</tspan></text>
    <text x="60" y="145" font-size="20" fill="#9DA7B3">Étudiante BTS SIO SISR  ·  Systèmes et réseaux</text>
  </g>

  <!-- Ligne de commande animée -->
  <g font-family="'Courier New', monospace" font-size="19">
    <rect x="48" y="176" width="340" height="42" rx="8" fill="#0D1117" fill-opacity="0.75" stroke="#FF4D9D" stroke-opacity="0.4"/>
    <g clip-path="url(#typing)">
      <text x="62" y="204" fill="#F9A8D4">$ ./alternance --recherche</text>
    </g>
    <rect x="368" y="188" width="3" height="20" fill="#FF4D9D">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
